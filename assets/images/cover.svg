  <text x="80" y="253" font-size="92" font-weight="700" letter-spacing="-3" font-family="Arial" fill="#0B2030">КОНТРОЛЬ</text>
  <text x="80" y="355" font-size="92" font-weight="700" letter-spacing="-3" font-family="Arial" fill="#0B2030">ПАРОЛЕЙ</text>
  <path d="M82 400H230" stroke="#087F8C" stroke-width="7" />
  <text x="80" y="485" font-size="47" font-family="Arial" fill="#0B2030">в Wazuh</text>
  <text x="80" y="555" font-size="28" font-family="Arial" fill="#0B2030">Четыре поколения Windows.</text>
  <text x="80" y="600" font-size="28" font-family="Arial" fill="#0B2030">Единая панель без Active Directory.</text>
