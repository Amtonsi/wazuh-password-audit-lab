<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Контроль паролей в Wazuh</title>
  <desc id="desc">Четыре АРМ Windows XP, 7, 10 и 11 передают сведения в Wazuh. Лаборатория без Active Directory.</desc>
  <defs>
    </defs>
  <rect width="1600" height="900" fill="#F8F9F5" />
  <path d="M80 90H160" stroke="#087F8C" stroke-width="6" />
