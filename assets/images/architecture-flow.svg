  <polygon points="791,1023 809,1023 800,1040" fill="#07585C" />
  <polygon points="1093,866 1093,884 1110,875" fill="#07585C" />
  <polygon points="1097,1086 1097,1104 1080,1095" fill="#07585C" />
  <polygon points="791,1183 809,1183 800,1200" fill="#07585C" />
</svg>
